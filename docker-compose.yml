services:
  web:
    image: thaihadefi/travel-website:v1.0
    container_name: travel-website
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE=${DATABASE}
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  travel-network:
    driver: bridge
